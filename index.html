<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAGVIEW | AR Eco-Tourism</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        :root { --accent: #00ff88; --glass: rgba(0, 0, 0, 0.75); --blur: blur(20px); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: white; }

        /* THE FIX: Force video to be visible and correctly layered */
        video { 
            display: block !important;
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important; 
            width: 100vw !important; 
            height: 100vh !important;
            object-fit: cover !important; 
            z-index: 0 !important; 
        }

        /* Ensure the AR canvas is on top of the video but transparent */
        canvas.a-canvas { 
            z-index: 1 !important; 
            background: transparent !important;
        }

        #ui-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
        .top-nav, .bottom-area, .icon-btn, .cam-btn, .station-card { pointer-events: auto; }

        #match-notification { position: fixed; top: 120px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 50px; font-weight: 900; font-size: 11px; z-index: 5000; opacity: 0; transition: 0.3s; background: var(--accent); color: #000; }
        #match-notification.show { opacity: 1; }

        .overlay-screen { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .hidden { display: none !important; }
        
        .video-container { width: 90%; max-width: 600px; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; border: 1px solid var(--accent); background: #000; }
        .tut-vid { width: 100%; height: 100%; object-fit: cover; }

        .top-nav { position: absolute; top: 0; left: 0; right: 0; padding: 30px 20px; display: flex; justify-content: space-between; }
        .gps-display { background: var(--glass); backdrop-filter: var(--blur); padding: 10px 18px; border-radius: 12px; border-left: 3px solid var(--accent); display: flex; align-items: center; gap: 10px; }
        .pulse { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
        .active-pulse { animation: pulse-anim 2s infinite; }

        .bottom-area { position: absolute; bottom: 0; left: 0; right: 0; }
        .bottom-dock { padding: 20px 0 130px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); opacity: 0; transition: 0.5s; }
        .bottom-dock.visible { opacity: 1; }
        .scroll-container { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; }
        
        .station-card { min-width: 100px; height: 130px; background: #111; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; cursor: pointer; }
        .station-card.react { border-color: var(--accent); transform: translateY(-10px); }

        .nav-bar { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 25px; }
        .icon-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--glass); display: flex; align-items: center; justify-content: center; }
        .cam-btn { width: 75px; height: 75px; border-radius: 50%; background: #000; border: 3px solid #333; display: flex; align-items: center; justify-content: center; }
        .cam-btn.active { border-color: var(--accent); background: var(--accent); }

        #webview-container { position: fixed; inset: 0; z-index: 3000; background: #000; display: none; flex-direction: column; }
        
        @keyframes pulse-anim { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); } }
    </style>
</head>
<body>

    <div id="match-notification">IDENTICAL MATCH</div>

    <div id="webview-container">
        <div style="background:#111; padding:15px; display:flex; justify-content:space-between; align-items:center;">
            <span id="web-title" style="color:var(--accent); font-weight:900;">INFO</span>
            <button onclick="closeWebView()" style="background:#333; color:white; border:none; padding:8px 15px; border-radius:15px;">CLOSE</button>
        </div>
        <iframe id="web-frame" src="" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="home-page" class="overlay-screen">
        <h1 style="font-size:48px; margin:0; letter-spacing:8px;">BAG<span style="color:var(--accent)">VIEW</span></h1>
        <button onclick="goToTutorial()" style="background:var(--accent); border:none; padding:18px 60px; border-radius:50px; font-weight:900; margin-top:50px;">EXPLORE</button>
    </div>

    <div id="tutorial-page" class="overlay-screen hidden">
        <div class="video-container"><video id="tut-video" class="tut-vid" playsinline muted><source src="Assets/tutorial.mp4" type="video/mp4"></video></div>
        <div style="margin-top:20px; font-weight:900; cursor:pointer;" onclick="finishTutorial()">SKIP TUTORIAL ➔</div>
    </div>

    <div id="ui-layer" class="hidden">
        <div class="top-nav">
            <div class="gps-display">
                <div id="status-pulse" class="pulse"></div>
                <div id="gps-status" style="font-size:11px; font-weight:900;">READY</div>
            </div>
        </div>
        <div class="bottom-area">
            <div class="bottom-dock" id="gallery-hud">
                <div class="scroll-container" id="gallery-root"></div>
            </div>
            <div class="nav-bar">
                <div class="icon-btn" onclick="alert('Inquiry Mode')"><svg viewBox="0 0 24 24" width="22" fill="#fff"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></div>
                <div class="cam-btn" id="cam-toggle" onclick="toggleScanner()"><svg viewBox="0 0 24 24" width="32" fill="white"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm7-4h-2.69l-1.83-2H9.52l-1.83 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-7 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div>
                <div class="icon-btn" onclick="location.reload()"><svg viewBox="0 0 24 24" width="22" fill="#fff"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></div>
            </div>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
        embedded 
        renderer="colorManagement: true, transparent: true, alpha: true;"
        vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target-container"></a-entity>
    </a-scene>

    <script>
        const stations = [
            { name: "Map", thumb: "Assets/A1_Map.jpg", link: "https://jmflorencio.github.io/BaguioBotanicalMap/" },
            { name: "Arbor", thumb: "Assets/Arbor.png", link: "https://tour.panoee.net/69aa67e9add064456619ce3d/69aa73d3add0647cc419cf6d" },
            { name: "Cactus & Succulents", thumb: "Assets/Cactus&Succulents.png", link: "" },
            { name: "Chinese Garden", thumb: "Assets/Chinese%20Garden.png", link: "" },
            { name: "Friendship Garden", thumb: "Assets/City%20of%20Vaughan%20Friendship%20Garden.png", link: "https://tour.panoee.net/69aa67e9add064456619ce3d/69aa73d3add0647cc419cf6d" },
            { name: "Cordillera Village", thumb: "Assets/Cordillera%20Village.png", link: "" },
            { name: "Greenhouse", thumb: "Assets/Greenhouse.png", link: "" },
            { name: "Japanese Garden", thumb: "Assets/Japanese%20Garden.png", link: "https://tour.panoee.net/69aa67e9add064456619ce3d/69aa73d3add0647cc419cf6d" },
            { name: "Japanese Tunnel", thumb: "Assets/Japanese%20Tunnel.png", link: "https://tour.panoee.net/69aa67e9add064456619ce3d/69aa73d3add0647cc419cf6d" },
            { name: "Korea Garden", thumb: "Assets/Korea%20Garden.png", link: "https://tour.panoee.net/69aa67e9add064456619ce3d/69aa73d3add0647cc419cf6d" },
            { name: "Orchidarium", thumb: "Assets/Orchidarium.png", link: "https://tour.panoee.net/69aa67e9add064456619ce3d/69aa73d3add0647cc419cf6d" },
            { name: "PMSEA Garden", thumb: "Assets/PMSEA%20Garden.png", link: "https://tour.panoee.net/69aa67e9add064456619ce3d/69aa73d3add0647cc419cf6d" }
        ];

        function buildUI() {
            const root = document.getElementById('gallery-root');
            root.innerHTML = stations.map((s, i) => `
                <div class="station-card" id="card-${i}" onclick="handleCardTap(${i})">
                    <div style="height:70%; overflow:hidden; border-radius:12px 12px 0 0;">
                        <img src="${s.thumb}" style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div style="font-size:7px; text-align:center; padding:8px 2px; font-weight:bold;">${s.name}</div>
                </div>
            `).join('');
        }

        async function toggleScanner() {
            const btn = document.getElementById('cam-toggle');
            const hud = document.getElementById('gallery-hud');
            const sceneEl = document.querySelector('a-scene');
            
            if(!btn.classList.contains('active')) {
                try {
                    // Start Engine
                    await sceneEl.systems['mindar-image-system'].start();
                    
                    btn.classList.add('active');
                    hud.classList.add('visible');
                    document.getElementById('gps-status').innerText = "SCANNING...";

                    // THE FIX: Find and repair the video tag
                    const checkVideo = setInterval(() => {
                        const video = document.querySelector('video');
                        if (video) {
                            video.setAttribute('playsinline', '');
                            video.setAttribute('muted', '');
                            video.style.display = 'block';
                            video.style.visibility = 'visible';
                            video.play();
                            clearInterval(checkVideo);
                        }
                    }, 500);

                } catch (err) {
                    console.error(err);
                }
            } else {
                location.reload(); 
            }
        }

        function handleCardTap(index) {
            document.querySelectorAll('.station-card').forEach(c => c.classList.remove('react'));
            document.getElementById(`card-${index}`).classList.add('react');
        }

        function setupTracking() {
            const container = document.getElementById('target-container');
            stations.forEach((s, i) => {
                const entity = document.createElement('a-entity');
                entity.setAttribute('mindar-image-target', `targetIndex: ${i}`);
                entity.addEventListener("targetFound", () => {
                    document.getElementById('match-notification').classList.add('show');
                    setTimeout(() => {
                        document.getElementById('match-notification').classList.remove('show');
                        if(s.link) openStation(i);
                    }, 1500);
                });
                container.appendChild(entity);
            });
        }

        function goToTutorial() {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('tutorial-page').classList.remove('hidden');
            document.getElementById('tut-video').play();
        }

        function finishTutorial() {
            document.getElementById('tutorial-page').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            buildUI();
            setupTracking();
        }

        function openStation(i) {
            const s = stations[i];
            document.getElementById('web-frame').src = s.link;
            document.getElementById('web-title').innerText = s.name;
            document.getElementById('webview-container').style.display = 'flex';
        }

        function closeWebView() {
            document.getElementById('webview-container').style.display = 'none';
            document.getElementById('web-frame').src = '';
        }
    </script>
</body>
</html>
